<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — The Scent Atelier</title>

    <link rel="stylesheet" href="../css/cart-mobile.css">
    <link rel="stylesheet" href="../css/cart-desktop.css" media="screen and (min-width: 900px)">
</head>

<body>
    <!-- HEADER -->
    <header class="header">

        <!--img src="images/top corner2.png" class="corner-img"-->

        <nav class="top-nav">
            <a href="index.html">Home</a>
            <a href="products-all.html">Products</a>
            <a href="products-his.html">Men</a>
            <a href="products-her.html">Women</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart</a>
            
        </nav>

        <div class="monogram-block">
            <div class="rose-gold icon-top">🌹</div>

            <div class="monogram-center">
                <span class="sa-letter">S</span>
                <div class="vine"></div>
                <span class="sa-letter">A</span>
            </div>

            <div class="rose-gold icon-bottom">🌿</div>
        </div>

        <div class="brand-name">The Scent Atelier</div>
       

        <h1 class="main-title">Your Cart</h1>

    </header>
        
    <!-- CART CONTAINER -->
    <div class="cart-container">

        <div id="cartItems"></div>

        <!-- ORDER SUMMARY -->
        <div class="cart-summary">
            <h2>Order Summary</h2>

            <div class="summary-line">
                <span>Subtotal:</span>
                <span id="subtotal">£0</span>
            </div>

            <div class="summary-line">
                <span>Shipping:</span>
                <span id="shipping">£10</span>
            </div>

            <div class="summary-total">
                <span>Total:</span>
                <span id="total">£0</span>
            </div>

            <button class="checkout-btn" onclick="window.location.href='checkout.html'">
                Proceed to Checkout
            </button>
        </div>

    </div>

    <footer>
        © 2026 The Scent Atelier — Curating Timeless scents — All Rights Reserved
    </footer>

    <script src="../js/cart.js"></script>

</body>
</html>
